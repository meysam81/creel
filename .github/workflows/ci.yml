name: ci

on:
  pull_request:
    branches:
      - main
    # edited: fixing the PR title re-runs the title check
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

# A new push to a PR replaces its running checks; main keeps every run (release-please reads it).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deny by default; each job asks for what it needs.
permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Run linters
        run: bun run check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.output.outputs.artifact-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: creel-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Output artifact name
        id: output
        run: |
          echo "artifact-name=creel-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: End-to-end tests
        run: bun run e2e
      - if: failure()
        name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # release-please reads the squash-merge commit, which is the PR title
      - name: Conventional PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            revert
            build
            deps
            chore
            ci
            docs
            refactor
            test
            style

  # The one status to require in branch protection.
  required:
    name: required checks
    if: always()
    needs: [lint, typecheck, test, build, e2e, pr-title]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac

  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [required]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - id: release-please
        name: Release please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Attaches the package to the GitHub release. It never talks to the Web Store: submitting is
  # the manual publish workflow, so a release cannot reach users without a person starting it.
  release-assets:
    # no-op until the Web Store item exists and its secrets and CHROME_EXTENSION_ID variable are set
    if: needs.release-please.outputs.releases_created == 'true' && vars.CHROME_EXTENSION_ID != ''
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - name: Install crx3
        env:
          # renovate: go=github.com/mediabuyerbot/go-crx3
          CRX3_VERSION: v1.7.1
        run: |
          go install "github.com/mediabuyerbot/go-crx3/crx3@${CRX3_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Write signing key
        env:
          CHROME_SIGNING_PRIVATE_KEY: ${{ secrets.CHROME_SIGNING_PRIVATE_KEY }}
        run: |
          echo "$CHROME_SIGNING_PRIVATE_KEY" > key.pem
          chmod 400 key.pem
          head -1 key.pem | grep -q "BEGIN PRIVATE KEY" || {
            echo "ERROR: key is not PKCS#8 format (expected '-----BEGIN PRIVATE KEY-----')"
            echo "Convert with: openssl pkcs8 -topk8 -inform PEM -outform PEM -nocrypt -in old.pem -out new.pem"
            exit 1
          }
      - name: Sign Chrome extension
        run: |
          crx3 pack dist -p key.pem -o creel.crx
          ls -lh creel.crx
      - name: Create ZIP for Chrome Web Store
        run: |
          (cd dist && zip -r ../creel.zip .)
          ls -lh creel.zip
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" creel.crx creel.zip --clobber
      - if: always()
        name: Cleanup
        run: rm -f key.pem
